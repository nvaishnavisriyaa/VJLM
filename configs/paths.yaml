  gold_sources: "evaluation/gold_sources.jsonl"
  # Never used to tune chunking, retrieval, model or quantization settings.
  heldout: "evaluation/heldout.jsonl"

training:
  adapters: "training/adapters"
  notebooks: "training/notebooks"

quantization:
